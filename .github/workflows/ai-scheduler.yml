name: AI Notion Monitor & Developer Loop

on:
  #schedule:
  #  # 15分ごとに自動起動 (UTC基準。毎時 0, 15, 30, 45分に実行)
  #  - cron: '*/15 * * * *'
  workflow_dispatch: # GitHub画面からいつでも手動で即座に実行できるボタンを設置

# ワークフローがリポジトリへの書き込みやPR作成を行えるよう権限を定義
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  ai-development-flow:
    runs-on: ubuntu-latest

    steps:
      # 1. コードのチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # すべての分岐履歴を取得

      # 2. Node.js 環境のセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. パッケージマネージャーと Claude Code CLI のグローバルインストール
      - name: Install Dependencies
        run: |
          npm install -g pnpm
          
          # スクリプトの実行に必要な Notion 公式 SDK をインストールします
          npm install @notionhq/client
          
          # OAuthトークンを使用して動く CLI ツール「Claude Code」をグローバルインストール
          npm install -g @anthropic-ai/claude-code
          
          # もし既存の package.json がある場合は、他の依存関係も通常通りインストール
          if [ -f "package.json" ]; then
            pnpm install
          else
            echo "🎵 package.json が直下にないため、個別インストールのみで進行します"
          fi

      # 4. Notionに「Claude生成待ち」のタスクがないかポーリング（チェック）
      - name: Check Notion Database
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/cron-scheduler.js

      # 5. 【条件分岐】タスクがある場合のみ、専用のGitブランチを作成・切り替え
      - name: Create Feature Branch
        if: env.TASK_ID != ''
        run: |
          # Gitのコミット用ユーザー情報を設定
          git config --global user.name "Claude Developer Bot"
          git config --global user.email "claude-bot@yourdomain.local"
          
          # 💡【最重要修正】大文字の -B を使うことで、同一タスクIDによる再作成時でも
          # 既存ブランチをエラーなく「強制的に初期化して最新のmainから作り直す」ように変更します。
          git checkout -B feature/${{ env.TASK_ID }}

      # 6. 【条件分岐】Claude Codeによるソースコードの自動生成（定額プラン枠を利用）
      - name: Run Claude Coder
        if: env.TASK_ID != ''
        env:
          # 💡 従量課金のAPIキーではなく、事前に取得した定額枠用のOAuthトークンを渡します
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # スクリプトを呼び出し、内部で `claude` コマンドを実行させます
          node scripts/claude-coder.js

      # 8. 成果物を新しいブランチへプッシュ（既存ブランチは確実に上書き）
      - name: Push Code
        if: env.TASK_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Gitのユーザー設定
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. すでにステップ5で正しくチェックアウトしているため、
          # ここではそのまま現在の状態（変更分）をコミットして強制プッシュします。
          git add .
          git commit -m "🤖 自動生成: Notionタスク ${{ env.TASK_ID }} の実装コード（再作成）"
          
          # 4. リモート（GitHub）へ強制プッシュする (--force を付与)
          git push -u origin feature/${{ env.TASK_ID }} --force

      # 9. 【条件分岐】すべての工程が完了したら、Notionのステータスを「Git格納済み」に更新
      - name: Update Notion Status to Git Stored
        if: env.TASK_ID != ''
        run: |
          # JSONファイルから PAGE_ID をノードのワンライナーで安全に抽出
          PAGE_ID=$(node -e "console.log(require('./task_info.json').PAGE_ID)")
          
          echo "📝 Notionのタスク（ページID: $PAGE_ID）を『Git格納済み』に更新中..."
          
          curl -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer ${{ secrets.NOTION_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            --data '{
              "properties": {
                "ステータス": {
                  "status": {
                    "name": "Git格納済み"
                  }
                }
              }
            }'
          
          echo "🎉 すべての自動化プロセスが正常に完了しました！"
